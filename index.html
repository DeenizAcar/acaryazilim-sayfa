<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Acar Yazılım - Çok yakında sizlerle!" />
  <meta name="theme-color" content="#0a1f44" />
  <title>Acar Yazılım — Çok Yakında</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --navy: #0a1f44;
      --navy-light: #12294f;
      --accent: #4a90d9;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 0%, #14315e 0%, var(--navy) 55%, #06142e 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .card {
      max-width: 560px;
      width: 100%;
      animation: fadeInUp 0.9s ease both;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 32px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), #2c6fbf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      box-shadow: 0 12px 32px rgba(74, 144, 217, 0.35);
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: clamp(1rem, 3.2vw, 1.25rem);
      color: var(--muted);
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.4s ease-in-out infinite both;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    .footer {
      margin-top: 56px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.03em;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .dots span { animation: none; opacity: 0.8; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">AY</div>
    <h1>Acar Yazılım</h1>
    <p class="subtitle">Çok yakında sizlerle! Yeni sitemiz üzerinde çalışıyoruz.</p>
    <div class="dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <p class="footer">© 2026 Acar Yazılım · acaryazilim.com</p>
  </main>
</body>
</html>
